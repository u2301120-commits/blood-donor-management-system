<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Blood Donor Finder</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background-color: #f8f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: #800020;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
            font-size: 1.3rem;
        }

        .navbar-brand:hover {
            color: #f8d7da;
        }

        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }

        .reset-card {
            width: 100%;
            max-width: 500px;
            border: none;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            background-color: #800020;
            color: white;
            text-align: center;
            padding: 25px;
            border: none;
        }

        .card-header h2 {
            margin: 0;
            font-weight: bold;
        }

        .card-body {
            padding: 30px;
        }

        .form-label {
            font-weight: 600;
        }

        .required {
            color: #dc3545;
        }

        .demo-code {
            background-color: #f8e8ec;
            border: 1px solid #e5b9c5;
            border-radius: 10px;
            padding: 18px;
            text-align: center;
        }

        .demo-code strong {
            color: #800020;
        }

        .code-value {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 5px;
            color: #800020;
            overflow-wrap: anywhere;
        }

        .btn-reset {
            background-color: #800020;
            color: white;
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
        }

        .btn-reset:hover {
            background-color: #600018;
            color: white;
        }

        .back-link {
            color: #800020;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        footer {
            background-color: #800020;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">
                Blood Donor Finder
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-container">

        <div class="card reset-card">

            <div class="card-header">
                <h2>Reset Password</h2>
                <p class="mb-0 mt-2">
                    Create a new password for your account
                </p>
            </div>

            <div class="card-body">

                <!-- Demo Reset Code -->
                <div class="demo-code mb-4">

                    <strong>Demo Reset Code</strong>

                    <div class="code-value mt-2">
                        {{ reset_code }}
                    </div>

                    <small class="text-muted d-block mt-2">
                        This academic prototype displays the reset code
                        on screen. Email delivery can be added later.
                    </small>

                </div>

                <!-- Reset Password Form -->
                <form method="POST" action="/reset-password">

                    <input
                        type="hidden"
                        name="email"
                        value="{{ email }}">

                    <!-- Reset Code -->
                    <div class="mb-3">

                        <label for="reset_code" class="form-label">
                            Reset Code
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="reset_code"
                            name="reset_code"
                            class="form-control"
                            placeholder="Enter the 6-digit reset code"
                            maxlength="6"
                            pattern="[0-9]{6}"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            required>

                    </div>

                    <!-- New Password -->
                    <div class="mb-3">

                        <label for="new_password" class="form-label">
                            New Password
                            <span class="required">*</span>
                        </label>

                        <input
                            type="password"
                            id="new_password"
                            name="new_password"
                            class="form-control"
                            placeholder="Enter your new password"
                            minlength="6"
                            autocomplete="new-password"
                            required>

                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-4">

                        <label for="confirm_password" class="form-label">
                            Confirm New Password
                            <span class="required">*</span>
                        </label>

                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            class="form-control"
                            placeholder="Re-enter your new password"
                            minlength="6"
                            autocomplete="new-password"
                            required>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-reset w-100">

                        Reset Password

                    </button>

                </form>

                <!-- Back to Login -->
                <div class="text-center mt-4">
                    <a href="/profile" class="back-link">
                        &larr; Back to Login
                    </a>
                </div>

            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer>
        <p class="mb-0">
            &copy; 2026 Blood Donor Finder & Management System
        </p>
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
