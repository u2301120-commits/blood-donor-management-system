<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Reset Password
                    </h2>


                    <div class="alert alert-info">

                        <strong>Demo Reset Code:</strong>

                        <div class="fs-3 text-center mt-2">
                            {{ reset_code }}
                        </div>

                        <small>
                            This academic prototype displays
                            the reset code on screen.
                            Email delivery can be added later.
                        </small>

                    </div>


                    <form method="POST"
                          action="/reset-password">


                        <input
                            type="hidden"
                            name="email"
                            value="{{ email }}">


                        <div class="mb-3">

                            <label class="form-label">
                                Reset Code
                            </label>

                            <input
                                type="text"
                                name="reset_code"
                                class="form-control"
                                maxlength="6"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                New Password
                            </label>

                            <input
                                type="password"
                                name="new_password"
                                class="form-control"
                                minlength="6"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Confirm New Password
                            </label>

                            <input
                                type="password"
                                name="confirm_password"
                                class="form-control"
                                minlength="6"
                                required>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-danger w-100">

                            Reset Password

                        </button>


                    </form>


                    <div class="text-center mt-3">

                        <a href="/profile">
                            ← Back to Login
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
